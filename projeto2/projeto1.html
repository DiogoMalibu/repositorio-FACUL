<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 1 - Dashboard Glassmorphism</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
            max-width: 400px;
        }
        h1 { margin-bottom: 10px; }
        p { opacity: 0.9; line-height: 1.6; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }
        .back-link:hover { border-bottom: 2px solid white; }
    </style>
</head>
<body>
    <div class="glass-card">
        <h1>Projeto Alpha</h1>
        <p>Este projeto foca-se no design de interface moderna utilizando a técnica de <strong>Glassmorphism</strong>.</p>
        <a href="/index.html" class="back-link">← Voltar ao Início</a>
    </div>
</body>
</html>
</html>
